# редирект www -> без www (HTTPS)
server {
    listen 443 ssl;
    server_name www.vmetke.ru;

    ssl_certificate /etc/letsencrypt/live/vmetke.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmetke.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vmetke.ru$request_uri;
}

# основной сайт
server {
    server_name vmetke.ru;
    root /var/www/vmetke/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/vmetke/uploads/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vmetke.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmetke.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS (оба домена)
server {
    if ($host = www.vmetke.ru) {
        return 301 https://vmetke.ru$request_uri;
    }
    if ($host = vmetke.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name vmetke.ru www.vmetke.ru;
    return 404;
}